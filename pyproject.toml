[project]
name = "retinamodel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kate Tabor", email = "kate.tabor@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
    "tqdm>=4.70.0",
    "zarr>=3",
]

[project.scripts]
retinamodel = "retinamodel:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "jupyter>=1.1.1",
]
